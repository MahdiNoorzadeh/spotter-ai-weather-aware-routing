
services:
  - type: web
    name: spotter-ai-weather-aware-routing
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: NOMINATIM_USER_AGENT
        value: "SpotterAI-WeatherAwareRouting/1.0 (https://github.com/MahdiNoorzadeh/spotter-ai-weather-aware-routing)"
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: CORS_ALLOWED_ORIGINS
        value: https://spotter-ai-weather-aware-routing.vercel.app
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: HTTP_TIMEOUT_SECONDS
        value: "12"
      - key: WEATHER_CACHE_SECONDS
        value: "1800"
      - key: ROUTE_CACHE_SECONDS
        value: "900"
      - key: GEOCODE_CACHE_SECONDS
        value: "86400"
